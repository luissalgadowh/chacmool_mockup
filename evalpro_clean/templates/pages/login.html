{% extends 'base.html' %}
{% load static %}

{% block title %}Login - EvalPro{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card card-custom" style="max-width: 400px; width: 100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-clipboard-check fs-1 text-primary"></i>
                <h2 class="h3 fw-semibold text-slate-900 mt-3">EvalPro</h2>
                <p class="text-slate-500">Sistema de Evaluación de Empleados</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label form-label-custom">Email</label>
                    <input type="email" name="email" id="email" class="form-control form-control-custom" required>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label form-label-custom">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control form-control-custom" required>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <small class="text-slate-500">Credenciales de prueba:</small><br>
                <small class="text-slate-600">Admin: maria@empresa.com / maria123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
